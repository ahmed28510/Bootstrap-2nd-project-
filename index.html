<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="shortcut icon" href="./images/maimg.jpg" type="image/x-icon">
</head>

<body class="bg-primary-subtle">



  <div class="container-fluid  text-center align-items-start position-fixed">

    <div class="row">

      <div class="col-12 bg-primary bg-gradient py-2">
        <div class="row">



          <div class="col-4 text-start ps-2">
            <img src="./images/maimg.jpg" alt="my picture" class="img-fluid rounded-circle"
              style="width: 50px; height: 50px; object-fit: cover;">
          </div>

          <div class="col-4 d-flex justify-content-center align-items-center gap-3">
            <a href="index.html" class=" text-light fw-bold text-decoration-none">Sign up</a>
          </div>

          <div class="col-4 text-end pe-4 mt-1 d-flex justify-content-end align-items-center ">
          <span class="badge bg-primary-subtle text-black fs-6 fw-bold p-3 px-3">Welcome Ahmed</span>

          </div>

        </div>

      </div>

    </div>

  </div>
    <div class="container vh-100  d-flex justify-content-center align-items-center ">

        <div class="row  w-100 h-60  justify-content-center">
            <div class=" col-12 col-lg-4 col-md-6 text-white p-4 rounded shadow" style="background: linear-gradient(180deg, rgba(86, 204, 222, 0.8), rgba(56, 160, 183, 0.8), rgba(31, 171, 202, 0.8))">
              <div class="d-flex justify-content-center">
                <h4 class="text-center mb-4 bg-dark-subtle pt-1 pb-1 ps-4 pe-4 fw-bold fst-italic rounded shadow text-black">Login</h4>
                </div>
                <form>

                    <div class="mb-1 ">
                        <label for="exampleFormControlInput1" class="form-label fw-bold">Email address</label>
                        <input type="email" class="form-control " id="exampleFormControlInput1"
                            placeholder="name@example.com" required>
                            
                        <div id="textHelp" class="form-text text-white mb-2">Please enter your valid email address</div>
                    </div>

                    <div class="mb-4 ">
                        <label for="inputPassword"
                            class=" col-form-label text-white justify-content-center align-items-center fw-bold ">Password</label>
                        <input type="password" class="form-control" id="inputPassword"
                            placeholder="Enter your password" required>
                            <div id="textHelp" class="form-text text-white mb-2">Enter your correct Password</div>
                    </div>

                    <div class="d-flex justify-content-end ">
                        <a type="submit" class="btn btn-light text-info-emphasis fw-bold w-100" href="./dashboard.html">Login</a>
                    </div>

                </form>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.   3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="./js/script.js"></script>
</body>

</html>
